name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore my-upload-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload -storepass mypassword759902-keypass mypassword759902 -dname "CN=ProGamerBattle, OU=Gaming, O=ProGamerBattle, L=Meerut, S=UP, C=IN"
      - name: Upload Keystore
        uses: actions/upload-artifact@v4
        with:
          name: my-upload-key
          path: my-upload-key.jks
